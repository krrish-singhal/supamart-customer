<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Splash</title>
    <script src="./vendor/react.js"></script>
    <script src="./vendor/react-dom.js"></script>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        />
        <style>
          html,
          body,
          #dc-root,
          #dc-root > .sc-host {
            width: 100%;
            height: 100%;
            margin: 0;
          }
          body {
            overflow-x: hidden;
            background: #0a7c47;
          }
          .splash-screen {
            height: 100%;
            min-height: 480px;
            box-sizing: border-box;
          }
          html[data-paused="true"] * {
            animation-play-state: paused !important;
          }
          html[data-intro-complete="true"] .splash-intro {
            animation: none !important;
            transform: none !important;
          }
          html[data-reduced-motion="true"] * {
            animation: none !important;
            transition: none !important;
          }
          html[data-reduced-motion="true"] .splash-floater {
            opacity: var(--op) !important;
          }
          @media (prefers-reduced-motion: reduce) {
            .splash-floater {
              opacity: var(--op) !important;
            }
          }
          @media (max-width: 350px) {
            .splash-title {
              font-size: 32px !important;
              line-height: 40px !important;
            }
          }
          @media (min-width: 600px) {
            .splash-actions {
              max-width: 560px;
            }
          }

          a {
            color: #0a7c47;
            text-decoration: none;
          }
          a:hover {
            color: #075c35;
          }
          .tap {
            transition: transform 0.12s ease;
          }
          .tap:active {
            transform: scale(0.97);
          }
          @keyframes bagDrop {
            0% {
              transform: translateY(-260px) scale(0.7);
              opacity: 0;
            }
            45% {
              opacity: 1;
            }
            62% {
              transform: translateY(10px) scaleX(1.08) scaleY(0.9);
            }
            78% {
              transform: translateY(-6px) scale(1.02);
            }
            100% {
              transform: none;
            }
          }
          @keyframes swing {
            0% {
              transform: rotate(-26deg);
            }
            35% {
              transform: rotate(18deg);
            }
            60% {
              transform: rotate(-9deg);
            }
            80% {
              transform: rotate(4deg);
            }
            100% {
              transform: rotate(0);
            }
          }
          @keyframes drawM {
            from {
              stroke-dashoffset: 170;
            }
            to {
              stroke-dashoffset: 0;
            }
          }
          @keyframes ripple {
            from {
              transform: scale(0.6);
              opacity: 0.55;
            }
            to {
              transform: scale(2.6);
              opacity: 0;
            }
          }
          @keyframes letter {
            0% {
              opacity: 0;
              transform: translateY(22px) rotate(6deg);
            }
            100% {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(14px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes fill {
            from {
              transform: scaleX(0);
            }
            to {
              transform: scaleX(1);
            }
          }
          @keyframes fadeOut {
            to {
              opacity: 0;
            }
          }
          @keyframes drift {
            0% {
              transform: translateY(30px) rotate(var(--r0));
              opacity: 0;
            }
            20% {
              opacity: var(--op);
            }
            80% {
              opacity: var(--op);
            }
            100% {
              transform: translateY(-70px) rotate(var(--r1));
              opacity: 0;
            }
          }
          @keyframes cut {
            0% {
              opacity: 0;
              transform: scale(1.14);
            }
            12% {
              opacity: 1;
              transform: scale(0.97);
            }
            24% {
              transform: scale(1);
            }
            86% {
              opacity: 1;
              transform: scale(1);
            }
            100% {
              opacity: 0;
              transform: scale(1.02);
            }
          }
          @keyframes glow {
            0%,
            100% {
              transform: scale(1);
              opacity: 0.55;
            }
            50% {
              transform: scale(1.15);
              opacity: 0.8;
            }
          }
          @media (prefers-reduced-motion: reduce) {
            * {
              animation: none !important;
              transition: none !important;
            }
          }
        </style>
      </helmet>
      <div
        class="splash-screen"
        style="
          position: relative;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          background: #0a7c47;
          color: #ffffff;
          font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;
          overflow: hidden;
        "
      >
        <span
          aria-hidden="true"
          style="
            position: absolute;
            left: 50%;
            top: 300px;
            width: 420px;
            height: 420px;
            margin: -210px 0 0 -210px;
            border-radius: 210px;
            background: radial-gradient(
              circle,
              rgba(255, 255, 255, 0.16) 0%,
              rgba(255, 255, 255, 0) 65%
            );
            animation: glow 3.2s ease-in-out infinite;
          "
        ></span>

        <div
          aria-hidden="true"
          style="position: absolute; inset: 0; pointer-events: none"
        >
          <sc-for list="{{floaters}}" as="f" hint-placeholder-count="10">
            <span
              class="splash-floater"
              sc-camel-style="position: absolute; left: {{f.x}}; top: {{f.y}}; color: {{f.c}}; --r0: {{f.r0}}; --r1: {{f.r1}}; --op: {{f.op}}; opacity: 0; animation: drift {{f.dur}} ease-in-out infinite {{f.delay}}"
            >
              <svg
                width="{{f.s}}"
                height="{{f.s}}"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="{{f.d}}"></path>
              </svg>
            </span>
          </sc-for>
        </div>

        <div
          style="
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding-top: 20px;
          "
        >
          <div style="position: relative; width: 132px; height: 140px">
            <span
              class="splash-intro"
              aria-hidden="true"
              style="
                position: absolute;
                left: 16px;
                top: 34px;
                width: 100px;
                height: 100px;
                border-radius: 30px;
                border: 3px solid rgba(255, 255, 255, 0.7);
                opacity: 0;
                animation: ripple 1s ease-out both 0.62s;
              "
            ></span>
            <span
              class="splash-intro"
              aria-hidden="true"
              style="
                position: absolute;
                left: 16px;
                top: 34px;
                width: 100px;
                height: 100px;
                border-radius: 30px;
                border: 2px solid rgba(255, 176, 32, 0.8);
                opacity: 0;
                animation: ripple 1.2s ease-out both 0.8s;
              "
            ></span>
            <div
              class="splash-intro"
              style="
                position: absolute;
                inset: 0;
                animation: bagDrop 0.9s cubic-bezier(0.3, 0.7, 0.3, 1) both
                  0.05s;
                transform-origin: 50% 100%;
              "
            >
              <svg
                role="img"
                aria-label="MS Traders logo"
                width="132"
                height="140"
                viewBox="0 0 132 140"
                style="display: block; overflow: visible"
              >
                <g
                  class="splash-intro"
                  style="
                    transform-origin: 66px 36px;
                    animation: swing 1.1s ease-out both 0.55s;
                  "
                >
                  <path
                    d="M42 40 V32 a24 24 0 0 1 48 0 V40"
                    fill="none"
                    stroke="#FFB020"
                    stroke-width="10"
                    stroke-linecap="round"
                  ></path>
                </g>
                <rect
                  x="16"
                  y="34"
                  width="100"
                  height="100"
                  rx="30"
                  fill="#FFFFFF"
                ></rect>
                <path
                  class="splash-intro"
                  d="M42 112 V62 L66 90 L90 62 V112"
                  fill="none"
                  stroke="#0A7C47"
                  stroke-width="13"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-dasharray="170"
                  style="
                    animation: drawM 0.6s cubic-bezier(0.6, 0, 0.3, 1) both
                      0.85s;
                  "
                ></path>
              </svg>
              <svg
                class="splash-intro"
                aria-hidden="true"
                width="132"
                height="140"
                viewBox="0 0 132 140"
                style="
                  position: absolute;
                  left: 0;
                  top: 0;
                  display: block;
                  overflow: visible;
                  opacity: 0;
                  animation: cut 0.9s ease-out both 2s;
                "
              >
                <path
                  d="M42 40 V32 a24 24 0 0 1 48 0 V40"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-width="10"
                  stroke-linecap="round"
                ></path>
                <rect
                  x="16"
                  y="34"
                  width="100"
                  height="100"
                  rx="30"
                  fill="#FFB020"
                ></rect>
                <path
                  d="M42 112 V62 L66 90 L90 62 V112"
                  fill="none"
                  stroke="#0A7C47"
                  stroke-width="13"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <svg
                class="splash-intro"
                aria-hidden="true"
                width="132"
                height="140"
                viewBox="0 0 132 140"
                style="
                  position: absolute;
                  left: 0;
                  top: 0;
                  display: block;
                  overflow: visible;
                  opacity: 0;
                  animation: cut 0.9s ease-out both 2.9s;
                "
              >
                <path
                  d="M42 40 V32 a24 24 0 0 1 48 0 V40"
                  fill="none"
                  stroke="#FFB020"
                  stroke-width="10"
                  stroke-linecap="round"
                ></path>
                <rect
                  x="16"
                  y="34"
                  width="100"
                  height="100"
                  rx="30"
                  fill="#CBEBD8"
                ></rect>
                <path
                  d="M42 112 V62 L66 90 L90 62 V112"
                  fill="none"
                  stroke="#121712"
                  stroke-width="13"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <svg
                class="splash-intro"
                aria-hidden="true"
                width="132"
                height="140"
                viewBox="0 0 132 140"
                style="
                  position: absolute;
                  left: 0;
                  top: 0;
                  display: block;
                  overflow: visible;
                  opacity: 0;
                  animation: cut 0.9s ease-out both 3.8s;
                "
              >
                <path
                  d="M42 40 V32 a24 24 0 0 1 48 0 V40"
                  fill="none"
                  stroke="#FFB020"
                  stroke-width="10"
                  stroke-linecap="round"
                ></path>
                <rect
                  x="16"
                  y="34"
                  width="100"
                  height="100"
                  rx="30"
                  fill="#121712"
                ></rect>
                <path
                  d="M42 112 V62 L66 90 L90 62 V112"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-width="13"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </div>
          </div>

          <h1
            class="splash-title"
            aria-label="MS Traders"
            style="
              margin: 0;
              display: flex;
              font-size: 36px;
              font-weight: 800;
              letter-spacing: -1px;
              line-height: 44px;
            "
          >
            <sc-for list="{{letters}}" as="l" hint-placeholder-count="10">
              <span
                class="splash-intro"
                aria-hidden="true"
                sc-camel-style="display: inline-block; white-space: pre; animation: letter .45s cubic-bezier(.2,.9,.3,1.2) both {{l.delay}}"
                >{{l.ch}}</span
              >
            </sc-for>
          </h1>
          <p
            class="splash-intro"
            style="
              margin: -10px 0 0;
              font-size: 15px;
              color: #cbebd8;
              animation: rise 0.5s ease both 1.75s;
            "
          >
            Groceries at trader prices
          </p>

          <div
            class="splash-intro"
            aria-hidden="true"
            style="
              width: 180px;
              height: 7px;
              border-radius: 4px;
              background: rgba(255, 255, 255, 0.25);
              overflow: hidden;
              margin-top: 14px;
              animation: rise 0.4s ease both 1.7s;
            "
          >
            <span
              class="splash-intro"
              style="
                display: block;
                width: 100%;
                height: 100%;
                border-radius: 4px;
                background: #ffb020;
                box-shadow: 0 0 10px rgba(255, 176, 32, 0.7);
                transform-origin: left;
                animation: fill 2.7s linear both 2s;
              "
            ></span>
          </div>
        </div>

        <div
          class="splash-actions splash-intro"
          style="
            position: relative;
            width: 100%;
            padding: 0 24px 32px;
            box-sizing: border-box;
            animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both 4.85s;
          "
        >
          <a
            href="Locate.dc.html"
            class="tap"
            style="
              height: 56px;
              border-radius: 14px;
              background: #ffffff;
              color: #0a7c47;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 16px;
              font-weight: 800;
              box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
            "
            >Get started</a
          >
          <p
            style="
              margin: 12px 0 0;
              text-align: center;
              font-size: 14px;
              color: #cbebd8;
            "
          >
            Have an account?
            <a
              href="Login.dc.html"
              style="
                display: inline-block;
                padding: 10px 2px;
                color: #ffffff;
                font-weight: 800;
              "
              >Log in</a
            >
          </p>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":390,"height":844}}'
    >
      class Component extends DCLogic {
        renderVals() {
          const word = 'MS Traders';
          const icons = [
            'M12 21c-4-3-7-7-7-11a7 7 0 0 1 14 0c0 4-3 8-7 11zM12 4c1-2 3-2 4-2',
            'M7 3h10v4l2 3v11H5V10l2-3zM5 12h14',
            'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2',
            'M4 20c8 0 14-6 16-16C10 6 4 10 4 20zM4 20l7-7',
            'M6 14l9-9a3 3 0 0 1 4 4l-9 9-6 2z',
            'M12 3c4 4 6 7 6 10a6 6 0 0 1-12 0c0-3 2-6 6-10z',
            'M3 10h18l-2 10H5zM8 10l3-6M16 10l-3-6',
            'M6 4h12v4H6zM7 8h10v12H7z',
            'M12 2v4M5 7c0 8 3 13 7 15 4-2 7-7 7-15-4 0-7-1-7-1s-3 1-7 1z',
            'M4 12a8 8 0 0 1 16 0zM12 12v8'
          ];
          const spots = [[34, 120], [300, 90], [60, 330], [318, 300], [24, 560], [330, 540], [150, 70], [250, 640], [90, 700], [196, 470]];
          return {
            letters: word.split('').map((ch, i) => ({ ch: ch === ' ' ? ' ' : ch, delay: (1.2 + i * 0.045).toFixed(3) + 's' })),
            floaters: spots.map((p, i) => ({
              x: (p[0] / 390 * 100) + '%',
              y: (p[1] / 844 * 100) + '%',
              s: 22 + (i % 3) * 6,
              d: icons[i],
              c: i % 4 === 0 ? '#FFB020' : '#FFFFFF',
              op: i % 4 === 0 ? '0.3' : '0.14',
              r0: (i % 2 ? -14 : 10) + 'deg',
              r1: (i % 2 ? 12 : -16) + 'deg',
              dur: (6 + (i % 4)) + 's',
              delay: (0.4 + i * 0.55).toFixed(2) + 's'
            }))
          };
        }
      }
    </script>
  </body>
</html>
